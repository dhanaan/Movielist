[project]
name = "movielist"
version = "0.1.0"
description = "lightweight CLI tool to search movies/tv-series"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "requests>=2.34.2",
]

[project.scripts]
movielist = "movielist.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
