name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: movielist-windows
            built_file: dist/movielist.exe
          - os: macos-latest
            artifact_name: movielist-macos
            built_file: dist/movielist
          - os: ubuntu-latest
            artifact_name: movielist-linux
            built_file: dist/movielist

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv add --dev pyinstaller

      - name: Build executable
        run: uv run pyinstaller --onefile --name movielist src/movielist/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.built_file }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so generate_release_notes can diff against the previous tag

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and rename artifacts
        run: |
          mkdir release-files
          cp artifacts/movielist-windows/movielist.exe release-files/movielist-windows.exe
          cp artifacts/movielist-macos/movielist release-files/movielist-macos
          cp artifacts/movielist-linux/movielist release-files/movielist-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true